# please generate github action script to run the test with vitest
name: Test
on: [pull_request]
jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm run test
      - name: Run Build
        run: npm run build:app
      - name: Run e2e tests
        run: npm run test:e2e
